name: Deploy Team 3 (Performance) to Hostinger VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 Deploying Team 3 Performance Management..."
            cd /var/www/performance

            # Pull latest changes from git
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master

            # Install dependencies
            composer install --no-dev --optimize-autoloader --no-interaction

            # Run migrations
            php artisan migrate --force

            # Clear and rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Fix permissions
            chown -R www-data:www-data /var/www/performance
            chmod -R 775 /var/www/performance/storage /var/www/performance/bootstrap/cache

            # Reload web server
            systemctl reload php8.3-fpm || systemctl reload php8.2-fpm || true
            systemctl reload nginx

            echo "✅ Deployment finished successfully!"
