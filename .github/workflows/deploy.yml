name: Deploy Team 3 Performance App to Hostinger VPS

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deploying Team 3 Performance System..."
            mkdir -p /var/www/performance
            cd /var/www/performance
            git config --global --add safe.directory /var/www/performance
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master

            # Dependencies & DB Migrations
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force

            # Optimize & Cache
            php artisan config:clear
            php artisan route:clear
            php artisan cache:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Set Permissions & Reload Web Server
            chown -R www-data:www-data /var/www/performance
            chmod -R 775 /var/www/performance/storage /var/www/performance/bootstrap/cache
            systemctl reload php8.3-fpm || systemctl reload php8.2-fpm || true
            systemctl reload nginx

            echo "✅ Deployment finished successfully!"
